name: Deploy Observatory

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OBSERVATORY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OBSERVATORY_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy build --project-name observatory --commit-dirty=true

      - name: Post Mattermost summary
        working-directory: .
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ssdd3sxizfdt9pd4fons31eb4w
        run: node scripts/post-mattermost-summary.js
